# Production compose project for iex-code (this repo). Applied on the prod
# host by ./deploy.sh.
#
# Prod chain: nginx :443 (host) -> 127.0.0.1:${IEX_CODE_PUBLIC_PORT} ->
# this app container. IEX_CODE_PUBLIC_PORT defaults to 49152 to match the
# proxy_pass pin in /etc/nginx/sites-available/iex.llmotions.com; change it
# only together with the nginx config.
#
# State continuity: the state/workspace host paths intentionally match the
# previous deployment so SQLite data and workspaces survive the cutover.
# Never run two app containers against the same state dir at once.
name: iex-code

services:
  app:
    image: ${IEX_CODE_IMAGE:-iex-code:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${IEX_CODE_APP_UID:-10001}
        APP_GID: ${IEX_CODE_APP_GID:-10001}
    env_file:
      - ${IEX_CODE_APP_ENV_FILE:?set IEX_CODE_APP_ENV_FILE}
    environment:
      DATABASE_PATH: /var/lib/iex-code/iex_code.db
      DESKTOP_WINDOW: "false"
      ERL_AFLAGS: "+Q ${IEX_CODE_NOFILE_LIMIT:-65536}"
      HOME: /var/lib/iex-code/home
      IEX_CODE_ALLOW_REMOTE: "true"
      IEX_CODE_BIND: 0.0.0.0
      IEX_CODE_DEFAULT_WORKSPACE: /workspaces/default
      IEX_CODE_RESOURCE_PROFILE: "${IEX_CODE_RESOURCE_PROFILE:-balanced}"
      IEX_CODE_MEMORY_LIMIT_MIB: "${IEX_CODE_MEMORY_LIMIT_MIB:-2048}"
      IEX_CODE_MEMORY_RESERVATION_MIB: "${IEX_CODE_MEMORY_RESERVATION_MIB:-512}"
      IEX_CODE_PIDS_LIMIT: "${IEX_CODE_PIDS_LIMIT:-1024}"
      IEX_CODE_NOFILE_LIMIT: "${IEX_CODE_NOFILE_LIMIT:-65536}"
      IEX_CODE_HTTP_POOL_SIZE: "${IEX_CODE_HTTP_POOL_SIZE:-8}"
      IEX_CODE_HTTP_POOL_IDLE_MS: "${IEX_CODE_HTTP_POOL_IDLE_MS:-60000}"
      IEX_CODE_HTTP_CONNECTION_IDLE_MS: "${IEX_CODE_HTTP_CONNECTION_IDLE_MS:-30000}"
      IEX_CODE_WORKSPACE_ROOT: /workspaces
      PHX_HOST: "${PHX_HOST:-iex.llmotions.com}"
      PHX_SERVER: "true"
      PORT: "4000"
    user: "${IEX_CODE_APP_UID:-10001}:${IEX_CODE_APP_GID:-10001}"
    ports:
      - "127.0.0.1:${IEX_CODE_PUBLIC_PORT:-49152}:4000"
    volumes:
      - type: bind
        source: ${IEX_CODE_STATE_DIR:-/var/lib/iex-code-web}
        target: /var/lib/iex-code
      - type: bind
        source: ${IEX_CODE_WORKSPACE_DIR:-/srv/iex-code-workspaces}
        target: /workspaces
    init: true
    mem_limit: "${IEX_CODE_MEMORY_LIMIT_MIB:-2048}m"
    mem_reservation: "${IEX_CODE_MEMORY_RESERVATION_MIB:-512}m"
    pids_limit: ${IEX_CODE_PIDS_LIMIT:-1024}
    ulimits:
      nofile:
        soft: ${IEX_CODE_NOFILE_LIMIT:-65536}
        hard: ${IEX_CODE_NOFILE_LIMIT:-65536}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/iex-code-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 60s
